[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amrita", email = "amritade2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "faiss-cpu>=1.11.0",
    "langchain-huggingface>=0.2.0",
    "sentence-transformers>=4.1.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
